<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HR ATS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-canvas d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <div class="bg-navy text-primary p-3 rounded-4 d-inline-block shadow">
                        <i class="fa-solid fa-envelope fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-navy mt-3 mb-1">HR Email Scanner</h3>
                    <p class="text-muted small">Sign in to access Stage 9 ATS Dashboard</p>
                </div>

                <div class="card card-custom border-0 p-4 p-md-5 shadow">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} rounded-3 small mb-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-uppercase fw-bold small text-muted">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg bg-light" value="admin" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-uppercase fw-bold small text-muted">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg bg-light" value="admin123" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow-sm mb-3">
                            Sign In to Dashboard
                        </button>
                    </form>

                    <div class="alert alert-info border-0 p-3 rounded-3 small mb-0">
                        <div class="fw-bold"><i class="fa-solid fa-circle-info me-1"></i> Demo Credentials:</div>
                        <div>User: <code>admin</code> • Pass: <code>admin123</code></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
